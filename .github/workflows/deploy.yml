name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
    paths: ['public/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7a07eda3070216ad4ab984322bd2d2a7
          command: pages deploy public --project-name=mk-messages --branch=main
