<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MK Messages</title>
<style>
:root{--bg:#f0f2f5;--panel:#fff;--text:#111b21;--sub:#667781;--line:#e9edef;--accent:#00a884;--accent2:#d9fdd3;--in:#fff;--chatbg:#efeae2;--hover:#f5f6f6;--danger:#d93025;--blue:#53bdeb}
:root[data-theme=dark]{--bg:#0b141a;--panel:#111b21;--text:#e9edef;--sub:#8696a0;--line:#222d34;--accent:#00a884;--accent2:#005c4b;--in:#202c33;--chatbg:#0b141a;--hover:#202c33}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600}
.btn.sec{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:var(--danger)}
.ib{background:none;border:0;font-size:20px;padding:6px 8px;border-radius:50%;line-height:1}
.ib:hover{background:var(--hover)}
input[type=text],input[type=password],textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
#auth{height:100%;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.card{background:var(--panel);border-radius:12px;padding:28px;width:100%;max-width:380px;box-shadow:0 2px 14px rgba(0,0,0,.12)}
.card h1{margin:0 0 4px;color:var(--accent);font-size:26px}
.card p{margin:0 0 16px;color:var(--sub)}
.card label{display:block;margin:10px 0 4px;font-size:13px;color:var(--sub)}
.err{color:var(--danger);min-height:20px;margin:8px 0;font-size:14px}
.link{background:none;border:0;color:var(--accent);padding:0;text-decoration:underline}
#app{height:100%;display:flex;max-width:1500px;margin:0 auto;background:var(--panel)}
#side{width:380px;max-width:100%;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--chatbg)}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.top .grow{flex:1;min-width:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;background-size:cover;background-position:center;position:relative}
.av.sm{width:30px;height:30px;font-size:13px}
.dot{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#25d366;border:2px solid var(--panel)}
#search{margin:8px 12px}
#chatlist{flex:1;overflow-y:auto;min-height:0}
.ci{display:flex;gap:12px;padding:10px 14px;align-items:center;cursor:pointer;border-bottom:1px solid var(--line)}
.ci:hover,.ci.sel{background:var(--hover)}
.ci .mid{flex:1;min-width:0}
.ci .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .lm{color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .rt{text-align:right;font-size:12px;color:var(--sub);flex:none}
.badge{display:inline-block;background:var(--accent);color:#fff;border-radius:10px;min-width:20px;padding:1px 6px;font-size:12px;margin-top:4px}
.empty{color:var(--sub);padding:30px;text-align:center}
#msgs{flex:1;overflow-y:auto;padding:12px 8%;min-height:0;display:flex;flex-direction:column;gap:3px}
.row{display:flex}
.row.me{justify-content:flex-end}
.b{max-width:75%;background:var(--in);padding:6px 9px 4px;border-radius:8px;position:relative;box-shadow:0 1px .5px rgba(0,0,0,.13);word-wrap:break-word;overflow-wrap:anywhere}
.me .b{background:var(--accent2)}
.sysmsg{align-self:center;background:var(--panel);color:var(--sub);font-size:12px;padding:4px 10px;border-radius:8px;margin:6px 0}
.sender{font-size:12.5px;font-weight:700;color:var(--accent)}
.txt{white-space:pre-wrap}
.txt a{color:var(--blue)}
.meta{font-size:11px;color:var(--sub);text-align:right;margin-top:2px;white-space:nowrap}
.tick.read{color:var(--blue)}
.quote{border-left:4px solid var(--accent);background:rgba(0,0,0,.06);padding:3px 8px;border-radius:4px;margin-bottom:4px;font-size:13px;color:var(--sub)}
.fwd{font-size:12px;color:var(--sub);font-style:italic}
.del{color:var(--sub);font-style:italic}
.react{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.react span{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 6px;font-size:13px}
.b img,.b video{max-width:100%;max-height:300px;border-radius:6px;display:block}
.b audio{max-width:240px}
.dd{position:absolute;top:0;right:2px;background:none;border:0;color:var(--sub);opacity:0;font-size:16px;padding:0 4px}
.b:hover .dd{opacity:1}
@media(hover:none){.dd{opacity:.6}}
#typing{height:18px;padding:0 8%;font-size:12px;color:var(--sub)}
#composer{display:flex;gap:6px;padding:8px 12px;background:var(--panel);align-items:flex-end;border-top:1px solid var(--line)}
#composer textarea{resize:none;max-height:120px;border-radius:20px}
#replybar{padding:6px 14px;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
#replybar .grow{flex:1;border-left:4px solid var(--accent);padding-left:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#placeholder{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--sub);text-align:center;padding:20px}
.menu{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.25);z-index:50;min-width:190px;padding:4px 0}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 16px}
.menu button:hover{background:var(--hover)}
.menu .emo{display:flex;padding:6px 10px;gap:4px}
.menu .emo button{width:auto;padding:2px 5px;font-size:20px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal{background:var(--panel);border-radius:12px;padding:20px;width:100%;max-width:400px;max-height:90%;overflow:auto}
.modal h3{margin:0 0 12px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.mem{display:flex;align-items:center;gap:10px;padding:6px 0}
.mem .grow{flex:1}
.num{font-size:28px;letter-spacing:4px;font-weight:700;color:var(--accent);text-align:center;margin:8px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:9px 16px;border-radius:8px;z-index:90}
.back{display:none}
@media(max-width:760px){
 #side{width:100%}
 #app.chat #side{display:none}
 #app:not(.chat) #main{display:none}
 .back{display:inline-block}
 #msgs{padding:10px 8px}
 .b{max-width:88%}
}
</style>
</head>
<body>

<div id="auth">
 <form class="card" id="authForm" autocomplete="on">
  <h1>MK Messages</h1>
  <p id="authSub">Sign in to continue</p>
  <div id="nameWrap" class="hidden"><label for="aName">Your name</label><input type="text" id="aName" autocomplete="name"></div>
  <label for="aUser">Username</label><input type="text" id="aUser" autocomplete="username" autocapitalize="none">
  <label for="aPass">Password</label><input type="password" id="aPass" autocomplete="current-password">
  <label style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="showPw"> Show password</label>
  <div class="err" id="authErr"></div>
  <button class="btn" id="authBtn" style="width:100%">Sign in</button>
  <p style="margin:14px 0 0;text-align:center"><button type="button" class="link" id="authSwitch">New here? Create an account</button></p>
  <p style="font-size:12px;margin-top:10px">The first account created becomes the Admin and can create groups.</p>
 </form>
</div>

<div id="app" class="hidden">
 <div id="side">
  <div class="top">
   <div class="av" id="meAv" title="Profile"></div>
   <div class="grow"><b>MK Messages</b></div>
   <button class="ib" id="btnTheme" title="Dark mode">🌓</button>
   <button class="ib" id="btnNew" title="Join or create group">➕</button>
   <button class="ib" id="btnOut" title="Sign out">⎋</button>
  </div>
  <input type="text" id="search" placeholder="Search chats">
  <div id="chatlist"></div>
 </div>
 <div id="main">
  <div id="placeholder"><h2>MK Messages</h2><p>Select a chat, or tap ➕ to join a group with its 6-digit number.</p></div>
  <div id="chatpane" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
   <div class="top">
    <button class="ib back" id="btnBack">←</button>
    <div class="av" id="hAv"></div>
    <div class="grow" id="hInfo" style="cursor:pointer"><b id="hName"></b><div id="hSub" style="font-size:12px;color:var(--sub)"></div></div>
    <button class="ib" id="btnMsgSearch" title="Search in chat">🔍</button>
    <button class="ib" id="btnMore" title="More">⋮</button>
   </div>
   <div id="msgSearchBar" class="top hidden"><input type="text" id="msgSearch" placeholder="Search messages"></div>
   <div id="msgs"></div>
   <div id="typing"></div>
   <div id="replybar" class="hidden"><div class="grow" id="replyText"></div><button class="ib" id="replyX">✕</button></div>
   <div id="composer">
    <button class="ib" id="btnAttach" title="Attach">📎</button>
    <input type="file" id="file" class="hidden">
    <textarea id="input" rows="1" placeholder="Type a message"></textarea>
    <button class="ib" id="btnMic" title="Voice note">🎤</button>
    <button class="ib" id="btnSend" title="Send" style="color:var(--accent)">➤</button>
   </div>
  </div>
 </div>
</div>

<div id="ov" class="hidden"><div class="modal" id="modal"></div></div>
<div id="toast" class="hidden"></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};

let token=store.get('mk_token'),me=null,chats=[],users={},cur=null,msgs={},typers={},ws=null,acks={},ackN=0,reply=null,regMode=false,retry=0,filter='',msgFilter='';

// theme
const applyTheme=t=>document.documentElement.setAttribute('data-theme',t);
applyTheme(store.get('mk_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
$('#btnTheme').onclick=()=>{const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';applyTheme(t);store.set('mk_theme',t)};

function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),2800)}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.25);o.start();o.stop(c.currentTime+.25)}catch{}}

// ---------- auth ----------
$('#showPw').onchange=e=>{$('#aPass').type=e.target.checked?'text':'password'};
$('#authSwitch').onclick=()=>{regMode=!regMode;$('#nameWrap').classList.toggle('hidden',!regMode);$('#authBtn').textContent=regMode?'Create account':'Sign in';$('#authSub').textContent=regMode?'Create your account':'Sign in to continue';$('#authSwitch').textContent=regMode?'Have an account? Sign in':'New here? Create an account';$('#authErr').textContent=''};
$('#authForm').onsubmit=async e=>{
 e.preventDefault();
 $('#authErr').textContent='';$('#authBtn').disabled=true;
 try{
  const r=await fetch(regMode?'/api/register':'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#aUser').value,password:$('#aPass').value,name:$('#aName').value})});
  const d=await r.json().catch(()=>({error:'Server error'}));
  if(!r.ok||d.error){$('#authErr').textContent=d.error||'Failed';return}
  token=d.token;store.set('mk_token',token);start();
 }catch{$('#authErr').textContent='Network error'}finally{$('#authBtn').disabled=false}
};
$('#btnOut').onclick=()=>{store.del('mk_token');token=null;try{ws&&ws.close()}catch{}location.reload()};

// ---------- socket ----------
function start(){$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');connect()}
function connect(){
 ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?token='+encodeURIComponent(token));
 ws.onopen=()=>{retry=0};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}onEv(m.ev,m.data)};
 ws.onclose=ev=>{
  if(ev.code===4001){store.del('mk_token');location.reload();return}
  setTimeout(connect,Math.min(1000*2**retry++,15000));
 };
}
function emit(ev,data,cb){
 if(!ws||ws.readyState!==1){toast('Reconnecting… try again');return}
 const m={ev,data};
 if(cb){const k=++ackN;m.ack=k;acks['ack:'+k]=cb}
 ws.send(JSON.stringify(m));
}
function onEv(ev,d){
 if(ev.startsWith('ack:')){const f=acks[ev];delete acks[ev];f&&f(d);return}
 switch(ev){
  case 'init':me=d.me;chats=d.chats;d.users.forEach(u=>users[u.id]=u);users[me.id]=me;renderMe();renderList();if(cur&&chats.find(c=>c.id===cur))openChat(cur,true);break;
  case 'chats':chats=d;renderList();if(cur){if(!chats.find(c=>c.id===cur)){closeChat()}else renderHeader()}break;
  case 'users':d.forEach(u=>users[u.id]=u);if(d.find(u=>u.id===me.id))me=users[me.id];renderMe();renderList();if(cur)renderHeader();renderMsgs(true);break;
  case 'presence':if(users[d.id]){users[d.id].online=d.online;if(d.lastSeen)users[d.id].lastSeen=d.lastSeen;renderList();if(cur)renderHeader()}break;
  case 'message':{
   const l=msgs[d.chat];if(l&&!l.find(x=>x.id===d.id))l.push(d);
   if(d.chat===cur){renderMsgs();if(d.from!==me.id&&!d.system){emit('chat:read',{chat:cur})}}
   else if(d.from&&d.from!==me.id){const c=chats.find(c=>c.id===d.chat);if(!c||!c.muted)beep()}
   break}
  case 'message:update':{const l=msgs[d.chat];const m=l&&l.find(x=>x.id===d.id);if(m){Object.assign(m,d);if(d.chat===cur)renderMsgs(true)}break}
  case 'message:remove':{const l=msgs[d.chat];if(l){msgs[d.chat]=l.filter(x=>x.id!==d.id);if(d.chat===cur)renderMsgs(true)}break}
  case 'chat:read':{const l=msgs[d.chat];if(l){l.forEach(m=>{if(!m.readBy.includes(d.user))m.readBy.push(d.user)});if(d.chat===cur)renderMsgs(true)}break}
  case 'chat:deleted':delete msgs[d];if(cur===d)closeChat();break;
  case 'typing':{
   const k=d.chat+':'+d.user;clearTimeout(typers[k]);
   if(d.typing){typers[k]=setTimeout(()=>{delete typers[k];renderTyping()},4000);typers[k+'n']=d.name}else delete typers[k];
   renderTyping();break}
 }
}

// ---------- helpers ----------
const initials=n=>(String(n||'?').trim()[0]||'?').toUpperCase();
function avHtml(name,avatar,online,cls){return `<div class="av ${cls||''}" style="${avatar?`background-image:url('${esc(avatar)}')`:''}">${avatar?'':esc(initials(name))}${online?'<span class="dot"></span>':''}</div>`}
function other(c){return users[c.members.find(m=>m!==me.id)]||{name:'Unknown'}}
function title(c){return c.type==='group'?c.name:other(c).name}
function fmtTime(ts){return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function fmtDay(ts){const d=new Date(ts),t=new Date();if(d.toDateString()===t.toDateString())return fmtTime(ts);if(t-d<6048e5)return d.toLocaleDateString([],{weekday:'short'});return d.toLocaleDateString()}
function lastSeen(u){if(u.online)return 'online';return u.lastSeen?'last seen '+fmtDay(u.lastSeen)+' '+fmtTime(u.lastSeen):''}
function preview(m){if(!m)return 'No messages yet';if(m.deleted)return '🚫 Message deleted';if(m.system)return m.text;const who=m.from===me.id?'You: ':'';return who+(m.text||(m.file?'📎 '+m.file.name:''))}
function linkify(t){return esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')}
const chatById=id=>chats.find(c=>c.id===id);

// ---------- list ----------
function renderMe(){$('#meAv').outerHTML=avHtml(me.name,me.avatar).replace('class="av ','id="meAv" title="Profile" class="av ');$('#meAv').onclick=profileModal}
function renderList(){
 const q=filter.toLowerCase();
 const list=chats.filter(c=>!q||title(c).toLowerCase().includes(q)).sort((a,b)=>(b.pinned-a.pinned)||((b.last?b.last.ts:0)-(a.last?a.last.ts:0)));
 $('#chatlist').innerHTML=list.length?list.map(c=>{
  const av=c.type==='group'?avHtml(c.name):avHtml(other(c).name,other(c).avatar,other(c).online);
  return `<div class="ci ${c.id===cur?'sel':''}" data-id="${esc(c.id)}">${av}<div class="mid"><div class="nm">${c.pinned?'📌 ':''}${esc(title(c))}${c.muted?' 🔇':''}</div><div class="lm">${esc(preview(c.last))}</div></div><div class="rt">${c.last?fmtDay(c.last.ts):''}${c.unread?`<br><span class="badge">${c.unread}</span>`:''}</div></div>`}).join(''):'<div class="empty">No chats yet.<br>Tap ➕ to join a group with a 6-digit number.</div>';
}
$('#chatlist').onclick=e=>{const el=e.target.closest('.ci');if(el)openChat(el.dataset.id)};
$('#search').oninput=e=>{filter=e.target.value;renderList()};

// ---------- chat ----------
function openChat(id,keep){
 cur=id;reply=null;msgFilter='';$('#msgSearch').value='';$('#msgSearchBar').classList.add('hidden');
 $('#app').classList.add('chat');$('#placeholder').classList.add('hidden');$('#chatpane').classList.remove('hidden');
 renderHeader();renderReply();renderList();
 emit('chat:history',{chat:id},d=>{
  if(cur!==id)return;
  if(d.error){toast(d.error);return}
  msgs[id]=d.messages;renderMsgs(true);emit('chat:read',{chat:id});
 });
 if(!keep&&matchMedia('(min-width:761px)').matches)$('#input').focus();
}
function closeChat(){cur=null;$('#app').classList.remove('chat');$('#chatpane').classList.add('hidden');$('#placeholder').classList.remove('hidden');renderList()}
$('#btnBack').onclick=closeChat;
function renderHeader(){
 const c=chatById(cur);if(!c)return;
 const av=c.type==='group'?avHtml(c.name):avHtml(other(c).name,other(c).avatar,other(c).online);
 $('#hAv').outerHTML=av.replace('class="av ','id="hAv" class="av ');
 $('#hName').textContent=title(c);
 $('#hSub').dataset.base=c.type==='group'?c.members.length+' members'+(c.onlyAdminPosts?' · only admin can post':''):lastSeen(other(c));
 renderTyping();
}
function renderTyping(){
 const names=Object.keys(typers).filter(k=>k.startsWith(cur+':')&&!k.endsWith('n')).map(k=>typers[k+'n']);
 $('#typing').textContent=names.length?names.join(', ')+(names.length>1?' are':' is')+' typing…':'';
 const s=$('#hSub');s.textContent=s.dataset.base||'';
}
function ticks(m,c){
 if(m.from!==me.id||m.system)return '';
 const others=c.members.filter(x=>x!==me.id);
 const read=others.length&&others.every(x=>m.readBy.includes(x));
 const deliv=(m.deliveredTo||[]).length>1;
 return `<span class="tick ${read?'read':''}">${deliv||read?'✓✓':'✓'}</span>`;
}
function fileHtml(f){
 if(!f||!f.url)return '';
 const u=esc(f.url),t=f.type||'';
 if(t.startsWith('image/'))return `<a href="${u}" target="_blank"><img src="${u}" alt="${esc(f.name)}"></a>`;
 if(t.startsWith('video/'))return `<video src="${u}" controls></video>`;
 if(t.startsWith('audio/'))return `<audio src="${u}" controls></audio>`;
 return `<a href="${u}" target="_blank" download="${esc(f.name)}">📎 ${esc(f.name)} (${Math.max(1,Math.round(f.size/1024))} KB)</a>`;
}
function renderMsgs(keepPos){
 const c=chatById(cur),box=$('#msgs');if(!c)return;
 const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;
 const top=box.scrollTop;
 const q=msgFilter.toLowerCase();
 const list=(msgs[cur]||[]).filter(m=>!q||(m.text||'').toLowerCase().includes(q));
 box.innerHTML=list.map(m=>{
  if(m.system)return `<div class="sysmsg">${esc(m.text)}</div>`;
  const mine=m.from===me.id,u=users[m.from]||{name:'Unknown'};
  let h='';
  if(c.type==='group'&&!mine)h+=`<div class="sender">${esc(u.name)}</div>`;
  if(m.forwarded)h+='<div class="fwd">↪ Forwarded</div>';
  if(m.replyTo)h+=`<div class="quote"><b>${esc((users[m.replyTo.from]||{}).name||'')}</b><br>${esc(m.replyTo.text)}</div>`;
  if(m.deleted)h+='<div class="del">🚫 This message was deleted</div>';
  else{h+=fileHtml(m.file);if(m.text)h+=`<div class="txt">${linkify(m.text)}</div>`}
  const rc=Object.entries(m.reactions||{}).map(([e,a])=>`<span>${esc(e)}${a.length>1?' '+a.length:''}</span>`).join('');
  if(rc)h+=`<div class="react">${rc}</div>`;
  h+=`<div class="meta">${(m.starredBy||[]).includes(me.id)?'⭐ ':''}${m.edited?'edited · ':''}${fmtTime(m.ts)} ${ticks(m,c)}</div>`;
  return `<div class="row ${mine?'me':''}"><div class="b" data-id="${esc(m.id)}">${m.deleted?'':'<button class="dd" data-act="menu">▾</button>'}${h}</div></div>`;
 }).join('')||'<div class="empty">No messages yet. Say hi 👋</div>';
 if(atBottom||!keepPos)box.scrollTop=box.scrollHeight;else box.scrollTop=top;
}
$('#msgs').onclick=e=>{
 const b=e.target.closest('.b');if(!b||!e.target.closest('[data-act=menu]'))return;
 msgMenu(b.dataset.id,e.target.getBoundingClientRect());
};
function popMenu(html,rect){
 closeMenu();
 const m=document.createElement('div');m.className='menu';m.id='menu';m.innerHTML=html;document.body.appendChild(m);
 const w=m.offsetWidth,h=m.offsetHeight;
 m.style.left=Math.max(8,Math.min(rect.left-w+30,innerWidth-w-8))+'px';
 m.style.top=Math.max(8,Math.min(rect.bottom,innerHeight-h-8))+'px';
 return m;
}
function closeMenu(){const m=$('#menu');if(m)m.remove()}
document.addEventListener('click',e=>{if(!e.target.closest('.menu')&&!e.target.closest('[data-act=menu]')&&e.target.id!=='btnMore')closeMenu()});
function msgMenu(mid,rect){
 const c=chatById(cur),m=(msgs[cur]||[]).find(x=>x.id===mid);if(!m)return;
 const mine=m.from===me.id,canAll=mine||c.admin===me.id||me.isAdmin;
 const emo=['👍','❤️','😂','😮','😢','🙏'].map(x=>`<button data-r="${x}">${x}</button>`).join('');
 const el=popMenu(`<div class="emo">${emo}</div><button data-a="reply">↩ Reply</button>${m.text?'<button data-a="copy">⧉ Copy</button>':''}<button data-a="star">${(m.starredBy||[]).includes(me.id)?'☆ Unstar':'⭐ Star'}</button><button data-a="fwd">↪ Forward</button>${mine&&m.text?'<button data-a="edit">✎ Edit</button>':''}<button data-a="delme">🗑 Delete for me</button>${canAll?'<button data-a="delall">🗑 Delete for everyone</button>':''}`,rect);
 el.onclick=ev=>{
  const b=ev.target.closest('button');if(!b)return;closeMenu();
  if(b.dataset.r){const mine=(m.reactions||{})[b.dataset.r]||[];emit('message:react',{chat:cur,id:mid,emoji:mine.includes(me.id)?'':b.dataset.r});return}
  switch(b.dataset.a){
   case 'reply':reply=m;renderReply();$('#input').focus();break;
   case 'copy':navigator.clipboard&&navigator.clipboard.writeText(m.text).then(()=>toast('Copied'));break;
   case 'star':emit('message:star',{chat:cur,id:mid});break;
   case 'fwd':forwardModal(m);break;
   case 'edit':{const t=prompt('Edit message',m.text);if(t&&t.trim())emit('message:edit',{chat:cur,id:mid,text:t});break}
   case 'delme':emit('message:delete',{chat:cur,id:mid,everyone:false});break;
   case 'delall':emit('message:delete',{chat:cur,id:mid,everyone:true});break;
  }
 };
}
function renderReply(){
 $('#replybar').classList.toggle('hidden',!reply);
 if(reply)$('#replyText').textContent=((users[reply.from]||{}).name||'')+': '+(reply.text||(reply.file?'📎 '+reply.file.name:''));
}
$('#replyX').onclick=()=>{reply=null;renderReply()};
$('#btnMsgSearch').onclick=()=>{$('#msgSearchBar').classList.toggle('hidden');$('#msgSearch').focus();msgFilter='';$('#msgSearch').value='';renderMsgs()};
$('#msgSearch').oninput=e=>{msgFilter=e.target.value;renderMsgs()};

// ---------- composer ----------
const inp=$('#input');let typingOn=false,typingT;
function autosize(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px'}
inp.addEventListener('input',()=>{
 autosize();
 if(!cur)return;
 if(!typingOn){typingOn=true;emit('typing',{chat:cur,typing:true})}
 clearTimeout(typingT);typingT=setTimeout(()=>{typingOn=false;emit('typing',{chat:cur,typing:false})},2000);
});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendText()}});
$('#btnSend').onclick=sendText;
function sendText(){
 const text=inp.value;if(!text.trim()||!cur)return;
 emit('message:send',{chat:cur,text,replyTo:reply&&reply.id},d=>{if(d&&d.error)toast(d.error)});
 inp.value='';autosize();reply=null;renderReply();
 clearTimeout(typingT);if(typingOn){typingOn=false;emit('typing',{chat:cur,typing:false})}
}
async function upload(blob,name,type){
 try{
  const r=await fetch('/api/upload',{method:'POST',headers:{Authorization:'Bearer '+token,'X-Filename':encodeURIComponent(name),'X-Mime':type||'application/octet-stream'},body:blob});
  const d=await r.json().catch(()=>({error:'Upload failed'}));
  if(!r.ok||d.error){toast(d.error||'Upload failed');return null}
  return d;
 }catch{toast('Upload failed');return null}
}
async function sendFile(blob,name,type){
 if(!cur)return;toast('Uploading…');
 const f=await upload(blob,name,type);if(!f)return;
 emit('message:send',{chat:cur,text:'',file:f,replyTo:reply&&reply.id},d=>{if(d&&d.error)toast(d.error)});
 reply=null;renderReply();$('#toast').classList.add('hidden');
}
$('#btnAttach').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)sendFile(f,f.name,f.type)};
let rec=null,chunks=[];
$('#btnMic').onclick=async()=>{
 if(rec){rec.stop();return}
 try{
  const s=await navigator.mediaDevices.getUserMedia({audio:true});
  rec=new MediaRecorder(s);chunks=[];
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());const b=new Blob(chunks,{type:rec.mimeType||'audio/webm'});rec=null;$('#btnMic').textContent='🎤';sendFile(b,'voice-note.'+(b.type.includes('mp4')?'m4a':'webm'),b.type)};
  rec.start();$('#btnMic').textContent='⏹';toast('Recording… tap ⏹ to send');
 }catch{toast('Microphone not available')}
};

// ---------- modals ----------
function modal(html){$('#modal').innerHTML=html;$('#ov').classList.remove('hidden')}
function closeModal(){$('#ov').classList.add('hidden');$('#modal').innerHTML=''}
$('#ov').onclick=e=>{if(e.target.id==='ov')closeModal()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMenu()}});
function bindModal(map){Object.entries(map).forEach(([id,fn])=>{const el=$('#modal #'+id);if(el)el.onclick=fn})}

$('#btnNew').onclick=()=>{
 modal(`<h3>Join a group</h3><input type="text" id="gNum" inputmode="numeric" maxlength="6" placeholder="6-digit group number"><div class="err" id="mErr"></div>
 <div class="acts"><button class="btn sec" id="mCancel">Cancel</button><button class="btn" id="gJoin">Join</button></div>
 ${me.isAdmin?`<hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><h3>Create a group <small style="color:var(--sub)">(admin)</small></h3><input type="text" id="gName" placeholder="Group name" maxlength="40" style="margin-bottom:8px"><input type="text" id="gDesc" placeholder="Description (optional)" maxlength="200"><label style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="gOnly"> Only admin can post</label><div class="acts"><button class="btn" id="gCreate">Create group</button></div>`:''}
 <hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><h3>Direct message</h3><input type="text" id="dUser" placeholder="Their username" autocapitalize="none"><div class="acts"><button class="btn sec" id="dOpen">Open chat</button></div>`);
 const join=()=>emit('group:join',{number:$('#gNum').value},d=>{if(d.error){$('#mErr').textContent=d.error;return}closeModal();openChat(d.chat.id)});
 $('#gNum').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();join()}});
 bindModal({mCancel:closeModal,gJoin:join,
  gCreate:()=>emit('group:create',{name:$('#gName').value,description:$('#gDesc').value,onlyAdminPosts:$('#gOnly').checked},d=>{if(d.error){$('#mErr').textContent=d.error;return}closeModal();openChat(d.chat.id);toast('Group number: '+d.chat.number)}),
  dOpen:()=>emit('dm:open',{username:$('#dUser').value},d=>{if(d.error){$('#mErr').textContent=d.error;return}closeModal();openChat(d.chat.id)})});
};

function forwardModal(m){
 modal(`<h3>Forward to…</h3>${chats.map(c=>`<div class="mem" style="cursor:pointer" data-id="${esc(c.id)}">${c.type==='group'?avHtml(c.name,null,false,'sm'):avHtml(other(c).name,other(c).avatar,false,'sm')}<div class="grow">${esc(title(c))}</div></div>`).join('')||'<div class="empty">No chats</div>'}<div class="acts"><button class="btn sec" id="mCancel">Cancel</button></div>`);
 bindModal({mCancel:closeModal});
 $('#modal').onclick=e=>{const el=e.target.closest('.mem');if(!el)return;
  emit('message:send',{chat:el.dataset.id,text:m.text,file:m.file,forwarded:true},d=>{toast(d&&d.error?d.error:'Forwarded')});closeModal()};
}

function profileModal(){
 modal(`<h3>Your profile</h3><div style="text-align:center">${avHtml(me.name,me.avatar)}<br><button class="link" id="pPic">Change photo</button><input type="file" id="pFile" accept="image/*" class="hidden"></div>
 <label>Name</label><input type="text" id="pName" maxlength="30" value="${esc(me.name)}"><label style="margin-top:8px;display:block">About</label><input type="text" id="pAbout" maxlength="120" value="${esc(me.about)}">
 <p style="color:var(--sub);font-size:13px">@${esc(me.username)}${me.isAdmin?' · Admin':''}</p>
 <div class="acts"><button class="btn sec" id="mCancel">Cancel</button><button class="btn" id="pSave">Save</button></div>`);
 let avatar;
 $('#pFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),s=Math.min(img.width,img.height);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,128,128);avatar=c.toDataURL('image/jpeg',.8);toast('Photo ready — tap Save')};img.src=URL.createObjectURL(f)};
 bindModal({mCancel:closeModal,pPic:()=>$('#pFile').click(),pSave:()=>{
  const d={name:$('#pName').value,about:$('#pAbout').value};if(avatar)d.avatar=avatar;
  emit('profile:update',d,r=>{if(r&&r.user){me=r.user;users[me.id]=me}renderMe();renderList();closeModal()})}});
}

function infoModal(){
 const c=chatById(cur);if(!c)return;
 if(c.type==='dm'){const u=other(c);modal(`<h3>${esc(u.name)}</h3><p style="color:var(--sub)">@${esc(u.username)} · ${esc(lastSeen(u))}</p><p>${esc(u.about||'')}</p><div class="acts"><button class="btn sec" id="mCancel">Close</button></div>`);bindModal({mCancel:closeModal});return}
 const manage=c.admin===me.id||me.isAdmin;
 modal(`<h3>${esc(c.name)}</h3><p style="color:var(--sub)">${esc(c.description||'')}</p>
 <div style="text-align:center;color:var(--sub);font-size:13px">Group number — share it so others can join</div><div class="num">${esc(c.number)}</div>
 <div style="text-align:center"><button class="link" id="gCopy">Copy number</button>${manage?' · <button class="link" id="gRegen">New number</button>':''}</div>
 <h4>${c.members.length} members</h4>
 ${c.members.map(id=>{const u=users[id]||{name:'Unknown'};return `<div class="mem">${avHtml(u.name,u.avatar,false,'sm')}<div class="grow">${esc(u.name)}${id===c.admin?' <small style="color:var(--accent)">group admin</small>':''}</div>${manage&&id!==c.admin?`<button class="link" data-rm="${esc(id)}">Remove</button>`:''}</div>`}).join('')}
 ${manage?`<label style="display:flex;gap:6px;align-items:center;margin-top:10px"><input type="checkbox" id="gOnly" ${c.onlyAdminPosts?'checked':''}> Only admin can post</label>`:''}
 <div class="acts"><button class="btn sec" id="gLeave">Leave</button>${manage?'<button class="btn danger" id="gDel">Delete group</button>':''}<button class="btn" id="mCancel">Close</button></div>`);
 bindModal({mCancel:closeModal,
  gCopy:()=>{navigator.clipboard&&navigator.clipboard.writeText(c.number).then(()=>toast('Copied'))},
  gRegen:()=>{if(confirm('Generate a new number? The old one stops working.'))emit('group:regenerate',{chat:c.id},()=>closeModal())},
  gLeave:()=>{if(confirm('Leave this group?'))emit('group:leave',{chat:c.id},()=>closeModal())},
  gDel:()=>{if(confirm('Delete this group for everyone?'))emit('group:delete',{chat:c.id},()=>closeModal())}});
 const o=$('#modal #gOnly');if(o)o.onchange=()=>emit('group:update',{chat:c.id,onlyAdminPosts:o.checked});
 $('#modal').onclick=e=>{const b=e.target.closest('[data-rm]');if(b&&confirm('Remove this member?'))emit('group:remove',{chat:c.id,user:b.dataset.rm},()=>closeModal())};
}
$('#hInfo').onclick=infoModal;
$('#btnMore').onclick=e=>{
 const c=chatById(cur);if(!c)return;
 const el=popMenu(`<button data-a="info">ℹ ${c.type==='group'?'Group info':'Contact info'}</button><button data-a="pin">${c.pinned?'Unpin chat':'📌 Pin chat'}</button><button data-a="mute">${c.muted?'Unmute':'🔇 Mute'}</button><button data-a="clear">Clear chat</button>`,e.target.getBoundingClientRect());
 el.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;closeMenu();
  if(b.dataset.a==='info')infoModal();
  if(b.dataset.a==='pin')emit('chat:pref',{chat:cur,pinned:!c.pinned});
  if(b.dataset.a==='mute')emit('chat:pref',{chat:cur,muted:!c.muted});
  if(b.dataset.a==='clear'&&confirm('Clear all messages for you?')){emit('chat:clear',{chat:cur});msgs[cur]=[];renderMsgs()}};
};

if(token)start();
})();
</script>
</body>
</html>
